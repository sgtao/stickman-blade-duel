# GitHub Pages への公開。検査は git push の前に .githooks/pre-push で行う（ここでは検査しない）
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 既定は読み取りのみ
permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # configure-pages が Pages の設定を読むため、読み取りの権限だけを与える
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6.0.0
      # 公開するのは index.html だけ（shots/ tests/ src/ は含めない）
      - name: 公開する本文を集める
        run: |
          mkdir _site
          cp index.html _site/
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 公開は 1 本ずつ直列に行う（途中で打ち切らない）
    concurrency:
      group: pages
      cancel-in-progress: false
    # Pages への書き込みに必要な権限は、この job だけに与える
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
