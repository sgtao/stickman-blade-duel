# GitHub Pages への公開。check で検査し、main への push のときだけ公開して、公開後に通しで確かめる
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 既定は読み取りのみ
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Playwright を入れる
        run: |
          npm i -g playwright@1.65.0
          playwright install --with-deps chromium
      # src/ から index.html を作り直し、コミットされた index.html と食い違えば止める
      - name: 生成物の一致を確かめる
        run: |
          node build.mjs
          git diff --exit-code index.html
      - name: 検査（perf 以外）
        run: |
          NODE_PATH=$(npm root -g) node tests/run_all.mjs check_static rules.test ai_strength e2e_flow visual mobile screens_fit
      # 共有ランナーでは時間の揺れが大きいため、参考扱いで不合格にしない
      - name: 性能の検査（参考）
        continue-on-error: true
        run: |
          NODE_PATH=$(npm root -g) node tests/run_all.mjs perf

  build:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # configure-pages が Pages の設定を読むため、読み取りの権限だけを与える
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # 公開するのは index.html だけ（shots/ tests/ src/ は含めない）
      - name: 公開する本文を集める
        run: |
          mkdir _site
          cp index.html _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 公開は 1 本ずつ直列に行う（途中で打ち切らない）。PR の check とは group を共有しない
    concurrency:
      group: pages
      cancel-in-progress: false
    # Pages への書き込みに必要な権限は、この job だけに与える
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Playwright を入れる
        run: |
          npm i -g playwright@1.65.0
          playwright install --with-deps chromium
      # 公開された URL を開き、配信本文の一致を再試行つきで確かめてから、通しの流れを確かめる
      - name: 公開後の通し確認
        env:
          GAME_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          NODE_PATH=$(npm root -g) node tests/smoke_pages.mjs
